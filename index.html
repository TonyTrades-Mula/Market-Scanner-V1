function getSession(){
  const et=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
  const h=et.getHours(),m=et.getMinutes(),d=et.getDay();
  if(d===0||d===6) return "WEEKEND";
  const mins=h*60+m;
  if(mins>=240&&mins<570) return "PREMARKET";
  if(mins>=570&&mins<960) return "MARKET OPEN";
  if(mins>=960&&mins<1200) return "AFTER HOURS";
  return "CLOSED";
}
function sessionColor(s){

  if(s==="AFTER HOURS") return C.purple;

}

async function fetchQuote(ticker){
  if(ticker==="SPX") return null;
  try{
    const r=await fetch(`${BASE}?function=GLOBAL_QUOTE&symbol=${ticker}&apikey=${AV_KEY}`);
    const j=await r.json();const d=j["Global Quote"];
    if(!d||!d["05. price"]) return null;
    return{price:parseFloat(d["05. price"]).toFixed(2),pct:d["10. change percent"]?.replace("%","").trim(),high:parseFloat(d["03. high"]).toFixed(2),low:parseFloat(d["04. low"]).toFixed(2),open:parseFloat(d["02. open"]).toFixed(2),vol:parseInt(d["06. volume"]).toLocaleString()};
  }catch{return null;}
}
async function fetchSentiment(ticker){
  try{
    const r=await fetch(`${BASE}?function=NEWS_SENTIMENT&tickers=${ticker}&limit=5&sort=LATEST&apikey=${AV_KEY}`);
    const j=await r.json();if(!j.feed?.length) return null;
    const arts=j.feed.slice(0,3);
    const avg=arts.reduce((s,a)=>{const t=a.ticker_sentiment?.find(x=>x.ticker===ticker);return s+(t?parseFloat(t.ticker_sentiment_score):0);},0)/arts.length;
    return{score:avg,label:avg>0.15?"Bullish":avg<-0.15?"Bearish":"Neutral",arts};
  }catch{return null;}
}
async function fetchPCR(ticker){
  try{const r=await fetch(`${BASE}?function=REALTIME_PUT_CALL_RATIO&symbol=${ticker}&apikey=${AV_KEY}`);const j=await r.json();return j.put_call_ratio?parseFloat(j.put_call_ratio):null;}catch{return null;}
}
async function fetchMovers(){

}
async function fetchNews(){

}

function Tag({label,color,small}){
  return <span style={{fontSize:small?8:9,letterSpacing:1.5,fontWeight:700,background:color+"18",color,border:`1px solid ${color}44`,borderRadius:2,padding:small?"1px 5px":"2px 7px",whiteSpace:"nowrap"}}>{label}</span>;
}
function Lvl({label,val,color}){
  return <div style={{background:color+"0a",border:`1px solid ${color}22`,borderRadius:3,padding:"8px 12px",flex:1,minWidth:80}}><div style={{fontSize:8,color:color+"88",letterSpacing:2,marginBottom:4}}>{label}</div><div style={{fontSize:13,color,fontFamily:"monospace",fontWeight:600}}>{val}</div></div>;
}
function Bar({val,max,color,height}){
  return <div style={{flex:1,height:height||4,background:C.border,borderRadius:99}}><div style={{width:`${Math.min(100,(val/max)*100)}%`,height:"100%",background:color,borderRadius:99,boxShadow:`0 0 6px ${color}88`,transition:"width 1s ease"}}/></div>;
}
function ScoreBar({score}){
  const color=sc(score);
  return <div style={{display:"flex",alignItems:"center",gap:8}}><Bar val={score} max={10} color={color}/><span style={{fontSize:11,color,fontFamily:"monospace",fontWeight:700,minWidth:32}}>{score}/10</span></div>;
}
function ConfBar({pct,type}){
  const color=pc(type);
  return <div style={{display:"flex",alignItems:"center",gap:8}}><Bar val={pct} max={100} color={color} height={6}/><span style={{fontSize:12,color,fontFamily:"monospace",fontWeight:800,minWidth:40}}>{pct}%</span></div>;
}
function PopBar({pct}){
  const color=pct>=60?C.bull:pct>=45?C.neutral:C.bear;
  return <div style={{display:"flex",alignItems:"center",gap:8}}><Bar val={pct} max={100} color={color} height={4}/><span style={{fontSize:10,color,fontFamily:"monospace",fontWeight:700,minWidth:36}}>{pct}% PoP</span></div>;
}
function IVBadge({rank}){
  const color=rank>=70?C.bear:rank>=40?C.neutral:C.bull;
  const label=rank>=70?"IV HIGH":rank>=40?"IV MED":"IV LOW";
  return <Tag label={`${label} ${rank}`} color={color} small/>;
}

          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:9,color:C.dim,letterSpacing:2}}>{a.putCall} CONFIDENCE</span>
            {ratio&&<span style={{fontSize:9,color:C.dim}}>P/C RATIO: <span style={{color:ratio>1?C.bear:C.bull}}>{ratio.toFixed(2)}</span></span>}
          </div>
          <ConfBar pct={conf} type={a.putCall}/>
        </div>
        <div style={{marginTop:6}}><PopBar pct={a.pop}/></div>
        <div style={{fontSize:11,color:C.muted,marginTop:9,lineHeight:1.6}}><span style={{color:scolor+"cc"}}>▸ </span>{a.cat}</div>
      </div>

      {open&&(
        <div style={{borderTop:`1px solid ${C.border}`,padding:"16px 18px"}}>
          {/* Option Play */}
          <div style={{background:pcolor+"0a",border:`1px solid ${pcolor}33`,borderRadius:4,padding:"11px 14px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
              <span style={{fontSize:9,color:pcolor+"99",letterSpacing:2}}>OPTION PLAY · {a.putCall} · {conf}% CONF · {a.pop}% PoP</span>
              <span style={{fontSize:9,color:C.dim}}>IV RANK: <span style={{color:a.ivRank>=70?C.bear:a.ivRank>=40?C.neutral:C.bull}}>{a.ivRank}</span></span>
            </div>
            <div style={{fontSize:13,color:pcolor,fontFamily:"monospace",fontWeight:600,lineHeight:1.6}}>{a.play}</div>
          </div>

          {/* Dark Pool */}
          {dp.length>0&&(
            <div style={{marginBottom:14}}>
              <div style={{fontSize:9,color:C.purple,letterSpacing:2,marginBottom:8}}>🌑 DARK POOL LEVELS</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {dp.map((d,i)=><div key={i} style={{background:C.purple+"0a",border:`1px solid ${C.purple}33`,borderRadius:3,padding:"8px 12px",flex:1,minWidth:100}}>
                  <div style={{fontSize:8,color:C.purple+"88",letterSpacing:2,marginBottom:3}}>{d.type} · {d.date}</div>
                  <div style={{fontSize:13,color:C.purple,fontFamily:"monospace",fontWeight:600}}>{d.level}</div>
                  <div style={{fontSize:9,color:C.dim}}>{d.size} shares</div>
                </div>)}
              </div>
            </div>
          )}

          {/* Sweep */}
          <div style={{marginBottom:14,background:"#0a0a1a",border:`1px solid ${C.blue}22`,borderRadius:3,padding:"8px 14px"}}>
            <span style={{fontSize:9,color:C.blue+"88",letterSpacing:2}}>OPTIONS SWEEP  </span>
            <span style={{fontSize:11,color:C.blue}}>{a.sweep}</span>
          </div>

          {/* Key Levels */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:9,color:C.dim,letterSpacing:2,marginBottom:8}}>KEY PRICE LEVELS</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <Lvl label="SUPPORT 1" val={a.s1} color={C.bull}/><Lvl label="SUPPORT 2" val={a.s2} color={C.bull}/>
              <Lvl label="RESIST 1" val={a.r1} color={C.bear}/><Lvl label="RESIST 2" val={a.r2} color={C.bear}/>
            </div>
          </div>

          {/* Trade Setup */}
          <div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:4,padding:"11px 14px",marginBottom:14}}>
            <div style={{fontSize:9,color:C.blue+"99",letterSpacing:2,marginBottom:5}}>TRADE SETUP</div>
            <div style={{fontSize:12,color:"#a8ccf0",lineHeight:1.7}}>{a.setup}</div>
          </div>

          {/* News + Social */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:12}}>
            <div>
              <div style={{fontSize:9,color:C.dim,letterSpacing:2,marginBottom:6}}>NEWS & CATALYST</div>
              <div style={{fontSize:11,color:C.muted,lineHeight:1.7}}>{a.news}</div>
              {sentiment?.arts?.length>0&&<div style={{marginTop:8}}>
                <div style={{fontSize:9,color:C.dim,letterSpacing:2,marginBottom:5}}>LIVE NEWS</div>
                {sentiment.arts.map((art,i)=><a key={i} href={art.url} target="_blank" rel="noreferrer" style={{display:"block",background:"#0a0a0a",border:`1px solid ${C.border}`,borderRadius:3,padding:"7px 10px",marginBottom:5}}><div style={{fontSize:10,color:C.muted,lineHeight:1.5}}>{art.title?.slice(0,80)}...</div><div style={{fontSize:9,color:C.dim,marginTop:2}}>{art.source}</div></a>)}
              </div>}
            </div>
            <div>
              <div style={{fontSize:9,color:C.dim,letterSpacing:2,marginBottom:6}}>SOCIAL BUZZ</div>
              <div style={{fontSize:11,color:C.muted,lineHeight:1.7}}>{a.buzz}</div>
            </div>
          </div>

          {quote?.vol&&<div style={{borderTop:`1px solid ${C.border}`,paddingTop:10}}><span style={{fontSize:9,color:C.dim,letterSpacing:2}}>VOLUME  </span><span style={{fontSize:11,color:C.neutral}}>📊 {quote.vol}</span>{quote.open&&<span style={{fontSize:10,color:C.dim,marginLeft:16}}>Open: ${quote.open}</span>}</div>}
        </div>
      )}
      <div style={{textAlign:"center",fontSize:10,color:C.dim,paddingBottom:6}}>{open?"▲ collapse":"▼ expand full analysis"}</div>
    </div>
  );
}

function App(){
  const[quotes,setQuotes]=useState({});
  const[sents,setSents]=useState({});
  const[ratios,setRatios]=useState({});
  const[news,setNews]=useState([]);
  const[movs,setMovs]=useState(null);
  const[lastR,setLastR]=useState(null);
  const[loading,setLoading]=useState(false);
  const[view,setView]=useState("all");
  const[tab,setTab]=useState("scanner");
  const[session,setSession]=useState(getSession());
  const timerRef=useRef(null);

  const refresh=useCallback(async()=>{
    setLoading(true);setSession(getSession());
    const qr={};
    for(const t of TICKERS.filter(x=>x!=="SPX")){const r=await fetchQuote(t);if(r)qr[t]=r;await new Promise(x=>setTimeout(x,350));}
    setQuotes(qr);
    const sr={};
    for(const t of ["GOOGL","MU","MSFT","TSLA","NVDA","META"]){const s=await fetchSentiment(t);if(s)sr[t]=s;await new Promise(x=>setTimeout(x,350));}
    setSents(sr);
    const rr={};
    for(const t of ["SPY","IWM","NVDA","META","TSLA"]){const p=await fetchPCR(t);if(p!=null)rr[t]=p;await new Promise(x=>setTimeout(x,350));}
    setRatios(rr);
    const[n,m]=await Promise.all([fetchNews(),fetchMovers()]);
    if(n)setNews(n);if(m)setMovs(m);
    setLastR(new Date());setLoading(false);
  },[]);

  useEffect(()=>{
    refresh();
    timerRef.current=setInterval(()=>{
      setSession(getSession());
      const s=getSession();
      if(s!=="WEEKEND"&&s!=="CLOSED") refresh();
    },5*60*1000);
    return()=>clearInterval(timerRef.current);
  },[refresh]);

  const sorted=[...TICKERS].sort((a,b)=>(AN[b]?.score||5)-(AN[a]?.score||5));
  const filt=view==="all"?sorted:view==="call"?sorted.filter(t=>AN[t]?.putCall==="CALL"):view==="put"?sorted.filter(t=>AN[t]?.putCall==="PUT"):sorted.filter(t=>AN[t]?.putCall==="NEUTRAL");
  const callC=TICKERS.filter(t=>AN[t]?.putCall==="CALL").length;
  const putC=TICKERS.filter(t=>AN[t]?.putCall==="PUT").length;
  const neutC=TICKERS.filter(t=>AN[t]?.putCall==="NEUTRAL").length;
  const sColor=sessionColor(session);

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text}}>
      {/* Header */}
      <div style={{borderBottom:`1px solid ${C.border}`,padding:"0 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:C.bg,zIndex:100}}>
        <div style={{padding:"12px 0"}}>
          <div style={{fontSize:9,letterSpacing:4,color:C.dim,marginBottom:2}}>MARKET SCANNER v2.0</div>
          <div style={{fontSize:19,fontWeight:700,color:C.text}}>
            TonyTrades 📊 <span style={{fontSize:11,fontFamily:"monospace",color:sColor,animation:session==="MARKET OPEN"?"pulse 1.5s infinite":"none"}}>● {session}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {lastR&&<div style={{textAlign:"right"}}><div style={{fontSize:9,color:C.dim}}>UPDATED</div><div style={{fontSize:10,color:C.muted,fontFamily:"monospace"}}>{lastR.toLocaleTimeString()}</div></div>}
          <button onClick={refresh} disabled={loading} style={{background:loading?C.surface:"#00e67618",border:`1px solid ${loading?C.border:C.bull+"55"}`,color:loading?C.dim:C.bull,borderRadius:3,padding:"7px 12px",fontSize:10,fontWeight:700,letterSpacing:1}}>
            {loading?<span style={{display:"flex",alignItems:"center",gap:5}}><span style={{display:"inline-block",width:8,height:8,border:`2px solid ${C.dim}`,borderTopColor:C.bull,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>LOADING</span>:"⟳ REFRESH"}
          </button>
        </div>
      </div>

      {/* Nav */}
      <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,padding:"0 20px",overflowX:"auto"}}>
        {[{k:"scanner",l:"📊 SCANNER"},{k:"premarket",l:"🌅 PRE-MARKET"},{k:"darkpool",l:"🌑 DARK POOL"},{k:"congress",l:"🏛️ CONGRESS"},{k:"news",l:"📰 NEWS"},{k:"movers",l:"🔥 MOVERS"}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{background:"none",color:tab===t.k?C.text:C.dim,fontSize:10,letterSpacing:1,padding:"11px 14px",borderBottom:tab===t.k?`2px solid ${C.bull}`:"2px solid transparent",whiteSpace:"nowrap"}}>{t.l}</button>
        ))}
      </div>

      {/* ⚠️ Iran Alert Banner */}
      <div style={{background:"#1a0a0a",borderBottom:`1px solid ${C.bear}44`,padding:"10px 20px",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:16,animation:"blink 1s infinite"}}>⚠️</span>
        <div>
          <span style={{fontSize:10,color:C.bear,fontWeight:700,letterSpacing:1}}>GEOPOLITICAL ALERT  </span>
          <span style={{fontSize:11,color:"#ffaaaa"}}>Iran/US warship conflict reports — oil surging, futures lower. Unconfirmed. Wait for open before sizing positions.</span>
        </div>
      </div>

      {/* Theme Banner */}
      <div style={{background:"#0a1628",borderBottom:"1px solid #1e3a5f",padding:"10px 20px"}}>
        <div style={{fontSize:9,color:C.blue+"99",letterSpacing:2,marginBottom:5}}>TODAY'S THEMES · {SCAN.date}</div>
        <div style={{fontSize:11,color:"#a8ccf0",lineHeight:1.7,marginBottom:8}}>{SCAN.reasoning}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{SCAN.themes.map(t=><Tag key={t} label={t} color={t.includes("⚠️")||t.includes("OIL")?C.bear:C.blue}/>)}</div>
      </div>

      <div style={{padding:"16px 20px"}}>
        {/* SCANNER TAB */}
        {tab==="scanner"&&<>
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            {SCAN.snap.map(m=><div key={m.l} style={{flex:1,minWidth:80,background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:"7px 10px"}}>
              <div style={{fontSize:7,color:C.dim,letterSpacing:2,marginBottom:2}}>{m.l}</div>
              <div style={{fontSize:13,fontWeight:700,fontFamily:"monospace",color:C.text}}>{m.v}</div>
              <div style={{fontSize:9,color:m.b?C.bull:C.bear,fontFamily:"monospace"}}>{m.c}</div>
            </div>)}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            {[{k:"all",l:`ALL (${TICKERS.length})`,c:C.text},{k:"call",l:`📈 CALLS (${callC})`,c:C.bull},{k:"put",l:`📉 PUTS (${putC})`,c:C.bear},{k:"neutral",l:`〰️ NEUTRAL (${neutC})`,c:C.neutral}].map(f=>(
              <button key={f.k} onClick={()=>setView(f.k)} style={{background:view===f.k?f.c+"22":C.surface,border:`1px solid ${view===f.k?f.c+"66":C.border}`,color:view===f.k?f.c:C.muted,borderRadius:3,padding:"6px 14px",fontSize:10,fontWeight:700,letterSpacing:1.5}}>{f.l}</button>
            ))}
          </div>
          {filt.map((t,i)=><Card key={t} ticker={t} quote={quotes[t]} sentiment={sents[t]} ratio={ratios[t]} idx={i}/>)}
        </>}

        {/* PRE-MARKET TAB */}
        {tab==="premarket"&&<div>
          <div style={{fontSize:9,color:C.neutral,letterSpacing:3,marginBottom:14}}>🌅 PRE-MARKET SESSION · 4:00 AM – 9:30 AM ET</div>
          <div style={{background:C.surface,border:`1px solid ${C.bear}44`,borderRadius:5,padding:"14px 16px",marginBottom:16}}>
            <div style={{fontSize:10,color:C.bear,fontWeight:700,marginBottom:8}}>⚠️ TODAY'S PRE-MARKET DRIVER</div>
            <div style={{fontSize:12,color:"#ffaaaa",lineHeight:1.7}}>Iran/US warship conflict reports sending futures lower and oil surging past $110. Conflicting reports — Iranian state media says US warship struck near Jask island after ignoring warnings. Not independently confirmed. This is the dominant pre-market narrative.</div>
          </div>
          {[
            {t:"SPY",gap:"-0.4% est",dir:"down",vol:"Low pre-mkt",note:"Iran risk-off. Watch $715 support at open."},
            {t:"GOOGL",gap:"-0.5% est",dir:"down",vol:"Moderate",note:"Iran dip = buy opportunity. ATH intact."},
            {t:"TSLA",gap:"+0.8% est",dir:"up",vol:"High",note:"Robotaxi evening expansion + 10B FSD miles milestone driving pre-mkt bids."},
            {t:"NVDA",gap:"-0.6% est",dir:"down",vol:"High",note:"Iran risk-off + Friday put sweep. Watch $195."},
            {t:"MU",gap:"-0.3% est",dir:"down",vol:"Moderate",note:"General risk-off. AI thesis intact. $488 support."},
            {t:"META",gap:"-0.8% est",dir:"down",vol:"Moderate",note:"Double negative — Iran + capex overhang."},
            {t:"MSFT",gap:"-0.4% est",dir:"down",vol:"Light",note:"Iran risk-off. $409 support key."},
            {t:"IWM",gap:"-0.3% est",dir:"down",vol:"Light",note:"Small caps less exposed. Best recovery play if Iran denied."},
            {t:"SPX",gap:"-0.4% est",dir:"down",vol:"N/A",note:"Index. Watch 7,150 key support."},
          ].map((s,i)=>(
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <span style={{fontSize:15,fontWeight:800,fontFamily:"monospace",color:C.text,marginRight:10}}>${s.t}</span>
                <span style={{fontSize:10,color:C.dim}}>{s.vol} volume</span>
                <div style={{fontSize:11,color:C.muted,marginTop:4,lineHeight:1.5}}>{s.note}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:14,fontWeight:700,fontFamily:"monospace",color:s.dir==="up"?C.bull:C.bear}}>{s.gap}</div>
                <div style={{fontSize:9,color:s.dir==="up"?C.bull:C.bear}}>{s.dir==="up"?"▲ GAP UP":"▼ GAP DOWN"}</div>
              </div>
            </div>
          ))}
          <div style={{marginTop:12,fontSize:10,color:C.dim,lineHeight:1.7}}>⚠️ Pre-market gaps estimated based on futures + overnight news. Actual open prices may differ significantly if Iran reports are confirmed or denied. Options do NOT trade pre-market.</div>
        </div>}

        {/* DARK POOL TAB */}
        {tab==="darkpool"&&<div>
          <div style={{fontSize:9,color:C.purple,letterSpacing:3,marginBottom:6}}>🌑 DARK POOL PRINTS</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:16,lineHeight:1.6}}>Dark pool levels = institutional block trades off public exchanges. These levels act as key support/resistance. More prints at a level = stronger significance.</div>
          {Object.entries(DARK_POOL).map(([ticker,levels])=>(
            <div key={ticker} style={{background:C.surface,border:`1px solid ${C.purple}22`,borderRadius:5,padding:"12px 16px",marginBottom:10}}>
              <div style={{fontSize:13,fontWeight:700,fontFamily:"monospace",color:C.text,marginBottom:8}}>${ticker}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {levels.map((d,i)=>(
                  <div key={i} style={{background:d.type==="Support"?C.bull+"0a":C.bear+"0a",border:`1px solid ${d.type==="Support"?C.bull:C.bear}33`,borderRadius:3,padding:"8px 14px",flex:1,minWidth:120}}>
                    <div style={{fontSize:8,color:d.type==="Support"?C.bull:C.bear,letterSpacing:2,marginBottom:3}}>{d.type.toUpperCase()} · {d.date}</div>
                    <div style={{fontSize:15,fontFamily:"monospace",fontWeight:700,color:d.type==="Support"?C.bull:C.bear}}>{d.level}</div>
                    <div style={{fontSize:9,color:C.dim,marginTop:2}}>{d.size} shares printed</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
          <div style={{marginTop:10,fontSize:10,color:C.dim}}>Dark pool data sourced from public disclosure databases. Updated daily. Not real-time.</div>
        </div>}

        {/* CONGRESS TAB */}
        {tab==="congress"&&<div>
          <div style={{fontSize:9,color:C.neutral,letterSpacing:3,marginBottom:6}}>🏛️ CONGRESS TRADES (Public Disclosure)</div>
          <div style={{fontSize:11,color:C.muted,marginBottom:16,lineHeight:1.6}}>US Congress members must disclose stock trades within 45 days. Many have historically beaten the market. These are public records — not inside information legally, but a useful signal.</div>
          {CONGRESS_TRADES.map((c,i)=>(
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,padding:"12px 16px",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontSize:15,fontWeight:700,fontFamily:"monospace",color:C.text}}>${c.ticker}</span>
                    <Tag label={c.action} color={c.action==="BUY"?C.bull:C.bear}/>
                    <Tag label={c.party==="R"?"REP":"DEM"} color={c.party==="R"?"#ff6b6b":"#6b9fff"}/>
                  </div>
                  <div style={{fontSize:11,color:C.text,marginBottom:3}}>{c.name}</div>
                  <div style={{fontSize:10,color:C.dim}}>{c.note}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:12,color:c.action==="BUY"?C.bull:C.bear,fontFamily:"monospace",fontWeight:700}}>{c.amount}</div>
                  <div style={{fontSize:9,color:C.dim,marginTop:3}}>{c.date}</div>
                </div>
              </div>
            </div>
          ))}
          <div style={{marginTop:10,fontSize:10,color:C.dim,lineHeight:1.7}}>Source: House/Senate financial disclosure forms. Data has up to 45-day reporting delay. Not financial advice.</div>
        </div>}

        {/* NEWS TAB */}
        {tab==="news"&&<div>
          <div style={{fontSize:9,color:C.dim,letterSpacing:3,marginBottom:14}}>LIVE MARKET HEADLINES</div>
          {news.length===0?<div style={{color:C.dim,fontSize:12}}>{loading?"Loading...":"No data — hit Refresh."}</div>
          :news.map((a,i)=><a key={i} href={a.url} target="_blank" rel="noreferrer" style={{display:"block",background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,padding:"12px 16px",marginBottom:10}}>
            <div style={{fontSize:12,color:C.text,lineHeight:1.6,marginBottom:6}}>{a.title}</div>
            <div style={{display:"flex",gap:12}}>
              <span style={{fontSize:10,color:C.blue}}>{a.source}</span>
              <span style={{fontSize:10,color:C.dim}}>{a.time_published?.slice(0,8)}</span>
              {a.overall_sentiment_label&&<span style={{fontSize:9,color:a.overall_sentiment_label==="Bullish"?C.bull:a.overall_sentiment_label==="Bearish"?C.bear:C.neutral}}>{a.overall_sentiment_label}</span>}
            </div>
          </a>)}
        </div>}

        {/* MOVERS TAB */}
        {tab==="movers"&&<div>
          {!movs?<div style={{color:C.dim,fontSize:12}}>{loading?"Loading...":"No data — hit Refresh."}</div>
          :[{t:"🚀 TOP GAINERS",d:movs.g,c:C.bull},{t:"📉 TOP LOSERS",d:movs.l,c:C.bear},{t:"⚡ MOST ACTIVE",d:movs.a,c:C.neutral}].map(s=>(
            <div key={s.t} style={{marginBottom:22}}>
              <div style={{fontSize:9,color:s.c,letterSpacing:3,marginBottom:10}}>{s.t}</div>
              {s.d.map((x,i)=><div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><span style={{fontSize:14,fontWeight:700,fontFamily:"monospace",color:C.text,marginRight:10}}>{x.ticker}</span><span style={{fontSize:11,color:C.muted}}>${x.price}</span></div>
                <span style={{fontSize:13,fontFamily:"monospace",fontWeight:600,color:s.c}}>{x.change_percentage}</span>
              </div>)}
            </div>
          ))}
        </div>}

        <div style={{marginTop:20,padding:"12px 0",borderTop:`1px solid ${C.border}`,fontSize:10,color:C.dim,lineHeight:1.8}}>
          <div style={{marginBottom:3}}>📡 Live prices: Alpha Vantage · Dark pool: public databases · Congress: House/Senate disclosures · Research: Yahoo Finance, TheStreet, Robinhood, TradingView, WSB</div>
          <div style={{marginBottom:3}}>🔄 Auto-refreshes every 5 min · Pre-market 4am–9:30am ET · Market 9:30am–4pm ET · After-hours 4pm–8pm ET</div>
          <div>⚠️ Not financial advice. Options trading involves substantial risk. Do your own research.</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
