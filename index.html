// ── SESSION ───────────────────────────────────────────────────────────────────
function getSession(){
const et=new Date(new Date().toLocaleString(“en-US”,{timeZone:“America/New_York”}));
const h=et.getHours(),m=et.getMinutes(),d=et.getDay();
if(d===0||d===6)return”WEEKEND”;
const mins=h*60+m;
if(mins>=240&&mins<570)return”PRE-MARKET”;
if(mins>=570&&mins<960)return”MARKET OPEN”;
if(mins>=960&&mins<1200)return”AFTER HOURS”;
return”CLOSED”;
}
function sessionColor(s){
if(s===“MARKET OPEN”)return C.bull;
if(s===“PRE-MARKET”)return C.neutral;
if(s===“AFTER HOURS”)return C.purple;
return C.dim;
}
function shouldAutoRefresh(s){return s===“PRE-MARKET”||s===“MARKET OPEN”||s===“AFTER HOURS”;}

// ── TWELVE DATA — fetch all tickers in ONE api call ───────────────────────────
async function fetchAllPrices(){
try{
const symbols=TICKERS.join(”,”);
const r=await fetch(`${TD_BASE}/quote?symbol=${symbols}&apikey=${TD_KEY}`);
const j=await r.json();
if(j.status===“error”) throw new Error(j.message);
const results={};
for(const t of TICKERS){
const q=TICKERS.length===1?j:j[t];
if(q&&q.close){
const price=parseFloat(q.close);
const prev=parseFloat(q.previous_close||price);
const chg=price-prev;
const chgPct=prev?((chg/prev)*100).toFixed(2):“0.00”;
results[t]={
price:price.toFixed(2),
change:chg>=0?”+”+chg.toFixed(2):chg.toFixed(2),
changePct:chg>=0?”+”+chgPct:chgPct,
high:parseFloat(q.high||price).toFixed(2),
low:parseFloat(q.low||price).toFixed(2),
open:parseFloat(q.open||price).toFixed(2),
volume:q.volume?parseInt(q.volume).toLocaleString():”—”,
isPos:chg>=0,
live:true,
};
}
}
return results;
}catch(e){
console.error(“Twelve Data:”,e.message);
return{};
}
}

function Tag({label,color,sm}){
return<span style={{fontSize:sm?8:9,letterSpacing:1.2,fontWeight:700,background:color+“18”,color,border:`1px solid ${color}44`,borderRadius:2,padding:sm?“1px 5px”:“2px 7px”,whiteSpace:“nowrap”}}>{label}</span>;

function Lvl({label,val,color}){

<div style={{fontSize:13,color,fontFamily:“monospace”,fontWeight:600}}>{val}</div>

  </div>;
}
function Bar({val,max,color,h}){
  return<div style={{flex:1,height:h||4,background:C.border,borderRadius:99}}>
    <div style={{width:`${Math.min(100,(val/max)*100)}%`,height:"100%",background:color,borderRadius:99,boxShadow:`0 0 6px ${color}88`,transition:"width 1s ease"}}/>
  </div>;
}
function ScoreBar({score}){
  const color=sc(score);
  return<div style={{display:"flex",alignItems:"center",gap:8}}><Bar val={score} max={10} color={color}/><span style={{fontSize:11,color,fontFamily:"monospace",fontWeight:700,minWidth:32}}>{score}/10</span></div>;
}
function ConfBar({pct,type}){
  const color=pcColor(type);
  return<div style={{display:"flex",alignItems:"center",gap:8}}><Bar val={pct} max={100} color={color} h={6}/><span style={{fontSize:12,color,fontFamily:"monospace",fontWeight:800,minWidth:40}}>{pct}%</span></div>;
}
function PopBar({pct}){
  const color=pct>=60?C.bull:pct>=45?C.neutral:C.bear;
  return<div style={{display:"flex",alignItems:"center",gap:8}}><Bar val={pct} max={100} color={color} h={3}/><span style={{fontSize:10,color,fontFamily:"monospace",minWidth:50}}>{pct}% PoP</span></div>;
}
function IVBadge({rank}){
  const color=rank>=70?C.bear:rank>=40?C.neutral:C.bull;
  const label=rank>=70?"IV HIGH":rank>=40?"IV MED":"IV LOW";
  return<Tag label={`${label} ${rank}`} color={color} sm/>;
}

function LivePrice({quote,prev}){
const [flash,setFlash]=useState(null);
useEffect(()=>{
if(!quote||!prev)return;
if(quote.price!==prev.price){
setFlash(parseFloat(quote.change)>=0?“green”:“red”);
setTimeout(()=>setFlash(null),1500);
}
},[quote?.price]);

if(!quote)return<div style={{fontSize:12,color:C.dim,fontFamily:“monospace”}}>Loading…</div>;
return(
<div style={{textAlign:“right”,animation:flash?`flash${flash==="green"?"Green":"Red"} 1.5s ease`:“none”}}>
<div style={{fontSize:18,fontWeight:800,fontFamily:“monospace”,color:C.text}}>${quote.price}</div>
<div style={{fontSize:13,fontFamily:“monospace”,fontWeight:600,color:quote.isPos?C.bull:C.bear}}>{quote.changePct}%</div>
{quote.high&&<div style={{fontSize:9,color:C.dim,marginTop:2}}>H:${quote.high} L:${quote.low}</div>}
</div>
);
}

const refresh=useCallback(async()=>{
setLoading(true);
const s=getSession();setSession(s);
const newQ=await fetchAllPrices();
if(Object.keys(newQ).length>0){
setPrevQuotes(q=>({…q,…quotes}));
setQuotes(newQ);
setPriceStatus(`Live via Twelve Data · ${new Date().toLocaleTimeString()}`);
} else {
setPriceStatus(“Price fetch failed — retrying…”);
}
setLastR(new Date());
setLoading(false);
},[quotes]);

useEffect(()=>{
refresh();
// Auto-refresh every 30s during market hours, every 5min otherwise
timerRef.current=setInterval(()=>{
const s=getSession();setSession(s);
if(shouldAutoRefresh(s)) refresh();
},30000);
return()=>clearInterval(timerRef.current);
},[]);

const sorted=[…TICKERS].sort((a,b)=>(AN[b]?.score||5)-(AN[a]?.score||5));
const filt=view===“all”?sorted:view===“call”?sorted.filter(t=>AN[t]?.putCall===“CALL”):view===“put”?sorted.filter(t=>AN[t]?.putCall===“PUT”):sorted.filter(t=>AN[t]?.putCall===“NEUTRAL”);
const callC=TICKERS.filter(t=>AN[t]?.putCall===“CALL”).length;
const putC=TICKERS.filter(t=>AN[t]?.putCall===“PUT”).length;
const neutC=TICKERS.filter(t=>AN[t]?.putCall===“NEUTRAL”).length;
const sColor=sessionColor(session);

return(
<div style={{minHeight:“100vh”,background:C.bg,color:C.text}}>
