function sc(s){ return s>=7?C.bull:s<=4?C.bear:C.neutral; }
function pcColor(p){ return p===“CALL”?C.bull:p===“PUT”?C.bear:C.neutral; }

function getSession(){
var et = new Date(new Date().toLocaleString(“en-US”,{timeZone:“America/New_York”}));
var h=et.getHours(), m=et.getMinutes(), d=et.getDay();
if(d===0||d===6) return “WEEKEND”;
var mins=h*60+m;
if(mins>=240&&mins<570) return “PRE-MARKET”;
if(mins>=570&&mins<960) return “MARKET OPEN”;
if(mins>=960&&mins<1200) return “AFTER HOURS”;
return “CLOSED”;
}

function sessionColor(s){
if(s===“MARKET OPEN”) return C.bull;
if(s===“PRE-MARKET”) return C.neutral;
if(s===“AFTER HOURS”) return C.purple;
return C.dim;
}

async function fetchAllPrices(){
try{
var symbols = TICKERS.join(”,”);
var r = await fetch(TD_BASE+”/quote?symbol=”+symbols+”&apikey=”+TD_KEY);
var j = await r.json();
if(j.status===“error”) throw new Error(j.message);
var results = {};
for(var i=0;i<TICKERS.length;i++){
var t = TICKERS[i];
var q = TICKERS.length===1 ? j : j[t];
if(q && q.close){
var price = parseFloat(q.close);
var prev = parseFloat(q.previous_close||price);
var chg = price - prev;
var chgPct = prev ? ((chg/prev)*100).toFixed(2) : “0.00”;
results[t] = {
price: price.toFixed(2),
change: chg>=0 ? “+”+chg.toFixed(2) : chg.toFixed(2),
changePct: chg>=0 ? “+”+chgPct : chgPct,
high: parseFloat(q.high||price).toFixed(2),
low: parseFloat(q.low||price).toFixed(2),
open: parseFloat(q.open||price).toFixed(2),
volume: q.volume ? parseInt(q.volume).toLocaleString() : “–”,
isPos: chg>=0,
live: true
};
}
}
return results;
} catch(e){
console.error(“Twelve Data error:”, e.message);
return {};
}
}
