// ── SESSION ───────────────────────────────────────────────────────────────────
function getSession(){
  try{
    var et=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
    var h=et.getHours(),m=et.getMinutes(),d=et.getDay();
    if(d===0||d===6) return "WEEKEND";
    var mins=h*60+m;
    if(mins>=240&&mins<570) return "PRE-MARKET";
    if(mins>=570&&mins<960) return "MARKET OPEN";
    if(mins>=960&&mins<1200) return "AFTER HOURS";
    return "CLOSED";
  }catch(e){ return "CLOSED"; }
}
function sessionColor(s){
  if(s==="MARKET OPEN") return "#00e676";
  if(s==="PRE-MARKET") return "#ffab00";
  if(s==="AFTER HOURS") return "#b57bee";
  return "#30363d";
}

// ── TWELVE DATA ───────────────────────────────────────────────────────────────
async function fetchPrices(){
  try{
    var r=await fetch(TD_BASE+"/quote?symbol="+TICKERS.join(",")+"&apikey="+TD_KEY);
    var j=await r.json();
    if(j.status==="error") throw new Error(j.message);
    var results={};
    for(var i=0;i<TICKERS.length;i++){
      var t=TICKERS[i];
      var q=TICKERS.length===1?j:j[t];
      if(q&&q.close){
        var price=parseFloat(q.close);
        var prev=parseFloat(q.previous_close||price);
        var chg=price-prev;
        var pct=prev?((chg/prev)*100).toFixed(2):"0.00";
        results[t]={
          price:price.toFixed(2),
          pct:(chg>=0?"+":"")+pct,
          high:parseFloat(q.high||price).toFixed(2),
          low:parseFloat(q.low||price).toFixed(2),
          open:parseFloat(q.open||price).toFixed(2),
          volume:q.volume?parseInt(q.volume).toLocaleString():"--",
          isPos:chg>=0
        };
      }
    }
    return results;
  }catch(e){ console.error(e); return {}; }
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function scoreColor(s){ return s>=7?"#00e676":s<=4?"#ff1744":"#ffab00"; }
function pcColor(p){ return p==="CALL"?"#00e676":p==="PUT"?"#ff1744":"#ffab00"; }

function tag(label,color,sm){
  var s=sm?"font-size:8px;padding:1px 5px":"font-size:9px;padding:2px 7px";
  return '<span class="tag'+(sm?" tag-sm":"')+'" style="'+s+';color:'+color+';background:'+color+'18;border-color:'+color+'44">'+label+'</span>';
}

function bar(val,max,color,h){
  h=h||4;
  var pct=Math.min(100,(val/max)*100);
  return '<div class="bar-wrap"><div class="bar-track" style="height:'+h+'px"><div class="bar-fill" style="height:'+h+'px;width:'+pct+'%;background:'+color+';box-shadow:0 0 6px '+color+'88"></div></div>';
}

function scoreBar(score){
  var color=scoreColor(score);
  return bar(score,10,color)+'<span class="bar-label" style="font-size:11px;color:'+color+';min-width:32px">'+score+'/10</span></div>';
}

function confBar(pct,type){
  var color=pcColor(type);
  return bar(pct,100,color,6)+'<span class="bar-label" style="font-size:12px;color:'+color+';min-width:40px">'+pct+'%</span></div>';
}

// ── RENDER CARD ───────────────────────────────────────────────────────────────
function renderCard(ticker,idx){
  var a=AN[ticker];
  var q=state.quotes[ticker];
  var isOpen=state.openCards[ticker];
  var isTop=a.score>=9;
  var scolor=scoreColor(a.score);
  var pcolor=pcColor(a.putCall);
  var ivColor=a.ivRank>=70?"#ff1744":a.ivRank>=40?"#ffab00":"#00e676";
  var ivLabel=a.ivRank>=70?"IV HIGH":"IV MED";
  if(a.ivRank<40) ivLabel="IV LOW";

  var priceHTML="";
  if(q){
    var chgColor=q.isPos?"#00e676":"#ff1744";
    priceHTML='<div class="card-price"><div class="card-price-val">$'+q.price+'</div><div class="card-price-chg" style="color:'+chgColor+'">'+q.pct+'%</div><div class="card-price-hl">H:$'+q.high+' L:$'+q.low+'</div></div>';
  } else {
    priceHTML='<div class="card-price"><div style="font-size:12px;color:#30363d">Loading...</div></div>';
  }

  var bodyHTML="";
  if(isOpen){
    var dpHTML=a.dp.map(function(d){
      var c=d.type==="Support"?"#00e676":"#ff1744";
      return '<div class="dp-card" style="background:'+c+'0a;border:1px solid '+c+'33"><div class="dp-type" style="color:'+c+'">'+d.type.toUpperCase()+'</div><div class="dp-level" style="color:'+c+'">'+d.level+'</div><div class="dp-size">'+d.size+' shares</div></div>';
    }).join("");

    var volHTML="";
    if(q){
      volHTML='<div class="vol-row"><div class="vol-item"><span>VOL  </span><span style="color:#ffab00">'+q.volume+'</span></div><div class="vol-item"><span>OPEN  </span><span style="color:#8b949e">$'+q.open+'</span></div><div class="vol-item"><span>HIGH  </span><span style="color:#00e676">$'+q.high+'</span></div><div class="vol-item"><span>LOW  </span><span style="color:#ff1744">$'+q.low+'</span></div></div>';
    }

    bodyHTML='<div class="card-body">'+
      '<div class="option-play" style="background:'+pcolor+'0a;border:1px solid '+pcolor+'33">'+
        '<div class="option-label" style="color:'+pcolor+'99">OPTION PLAY · '+a.putCall+' · '+a.conf+'% CONF · '+a.pop+'% PoP · IV RANK '+a.ivRank+'</div>'+
        '<div class="option-text" style="color:'+pcolor+'">'+a.play+'</div>'+
      '</div>'+
      '<div class="dp-row"><div class="dp-label">🌑 DARK POOL LEVELS</div><div class="dp-cards">'+dpHTML+'</div></div>'+
      '<div class="sweep-row"><span class="sweep-label">OPTIONS SWEEP  </span><span class="sweep-val">'+a.sweep+'</span></div>'+
      '<div class="levels-row">'+
        '<div class="levels-label">KEY PRICE LEVELS</div>'+
        '<div class="levels-grid">'+
          '<div class="level-card" style="background:#00e67608;border:1px solid #00e67622"><div class="level-label" style="color:#00e67688">SUPPORT 1</div><div class="level-val" style="color:#00e676">'+a.s1+'</div></div>'+
          '<div class="level-card" style="background:#00e67608;border:1px solid #00e67622"><div class="level-label" style="color:#00e67688">SUPPORT 2</div><div class="level-val" style="color:#00e676">'+a.s2+'</div></div>'+
          '<div class="level-card" style="background:#ff174408;border:1px solid #ff174422"><div class="level-label" style="color:#ff174488">RESIST 1</div><div class="level-val" style="color:#ff1744">'+a.r1+'</div></div>'+
          '<div class="level-card" style="background:#ff174408;border:1px solid #ff174422"><div class="level-label" style="color:#ff174488">RESIST 2</div><div class="level-val" style="color:#ff1744">'+a.r2+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="setup-row"><div class="setup-label">TRADE SETUP</div><div class="setup-text">'+a.setup+'</div></div>'+
      '<div class="grid2">'+
        '<div><div class="section-label">NEWS & CATALYST</div><div class="section-text">'+a.news+'</div></div>'+
        '<div><div class="section-label">SOCIAL BUZZ</div><div class="section-text">'+a.buzz+'</div></div>'+
      '</div>'+
      volHTML+
    '</div>';
  }

  return '<div class="card'+(isTop?" top":"")+'" id="card-'+ticker+'" onclick="toggleCard(\''+ticker+'\')" style="animation-delay:'+(idx*0.08)+'s">'+
    '<div class="card-header">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'+
        '<div>'+
          '<div class="card-tags">'+
            '<span style="font-size:18px;font-weight:800;font-family:monospace;letter-spacing:1px;color:#e6edf3">$'+ticker+'</span>'+
            tag(a.sent.toUpperCase(),scolor)+
            tag(a.putCall+' '+a.conf+'%',pcolor)+
            tag(ivLabel+' '+a.ivRank,ivColor,true)+
            (isTop?tag("TOP PICK","#00e676"):"")+
            (q?tag("LIVE","#00e676"):"")+
            tag(a.risk.toUpperCase()+" RISK",a.risk==="High"?"#ff1744":a.risk==="Low"?"#00e676":"#ffab00")+
          '</div>'+
          '<div class="card-name">'+a.name+' · '+a.sector+'</div>'+
        '</div>'+
        priceHTML+
      '</div>'+
      scoreBar(a.score)+
      '<div style="margin-top:10px">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:4px">'+
          '<span style="font-size:9px;color:#30363d;letter-spacing:2px">'+a.putCall+' CONFIDENCE</span>'+
          '<span style="font-size:9px;color:#30363d">PoP: <span style="color:'+(a.pop>=60?"#00e676":a.pop>=45?"#ffab00":"#ff1744")+'">'+a.pop+'%</span></span>'+
        '</div>'+
        confBar(a.conf,a.putCall)+
      '</div>'+
      '<div class="card-cat"><span style="color:'+scolor+'cc">▸ </span>'+a.cat+'</div>'+
    '</div>'+
    bodyHTML+
    '<div class="card-toggle">'+(isOpen?"▲ collapse":"▼ expand full analysis")+'</div>'+
  '</div>';
}

// ── RENDER TABS ───────────────────────────────────────────────────────────────
function renderScanner(){
  var sorted=TICKERS.slice().sort(function(a,b){return (AN[b]?AN[b].score:5)-(AN[a]?AN[a].score:5);});
  var filt=state.view==="all"?sorted:
    state.view==="call"?sorted.filter(function(t){return AN[t]&&AN[t].putCall==="CALL";}):
    state.view==="put"?sorted.filter(function(t){return AN[t]&&AN[t].putCall==="PUT";}):
    sorted.filter(function(t){return AN[t]&&AN[t].putCall==="NEUTRAL";});

  var callC=TICKERS.filter(function(t){return AN[t]&&AN[t].putCall==="CALL";}).length;
  var putC=TICKERS.filter(function(t){return AN[t]&&AN[t].putCall==="PUT";}).length;
  var neutC=TICKERS.filter(function(t){return AN[t]&&AN[t].putCall==="NEUTRAL";}).length;

  var snapHTML=SCAN.snap.map(function(m){
    return '<div class="snap-card"><div class="snap-label">'+m.l+'</div><div class="snap-val">'+m.v+'</div><div class="snap-chg" style="color:'+(m.b?"#00e676":"#ff1744")+'">'+m.c+'</div></div>';
  }).join("");

  var v=state.view;
  var filters=[
    {k:"all",l:"ALL ("+TICKERS.length+")",cls:"active-all"},
    {k:"call",l:"CALLS ("+callC+")",cls:"active-call"},
    {k:"put",l:"PUTS ("+putC+")",cls:"active-put"},
    {k:"neutral",l:"NEUTRAL ("+neutC+")",cls:"active-neutral"}
  ].map(function(f){
    return '<button class="filter-btn'+(v===f.k?" "+f.cls:"")+'" onclick="setView(\''+f.k+'\')">'+f.l+'</button>';
  }).join("");

  var cards=filt.map(function(t,i){return renderCard(t,i);}).join("");

  return '<div class="snap-row">'+snapHTML+'</div><div class="filters">'+filters+'</div>'+cards;
}

    {t:"NVDA",gap:"-0.6% est",dir:"down",note:"Iran risk-off + Google TPU. Watch $193 support at open."},
    {t:"SPY",gap:"-0.4% est",dir:"down",note:"Futures lower on Iran. $715 dark pool cluster is key."},
    {t:"NBIS",gap:"+0.5% est",dir:"up",note:"52-week high momentum. Relative strength vs macro."},
    {t:"TSLA",gap:"+0.3% est",dir:"up",note:"Robotaxi evening expansion. Watch $383 resistance."},
    {t:"META",gap:"-0.8% est",dir:"down",note:"Double negative — Iran + capex overhang. Puts dominating."}
  ];
  return '<div style="font-size:9px;color:#ffab00;letter-spacing:3px;margin-bottom:14px">PRE-MARKET · 4:00 AM - 9:30 AM ET</div>'+
    '<div style="background:#0d1117;border:1px solid #ff174433;border-radius:5px;padding:14px;margin-bottom:16px;font-size:12px;color:#ffaaaa;line-height:1.7">'+
    '⚠️ Iran/US conflict in Strait of Hormuz driving risk-off. Oil $110+. Wait for open before sizing positions. NBIS and TSLA are relative strength plays if market stabilizes.</div>'+
    items.map(function(s){
      var c=s.dir==="up"?"#00e676":"#ff1744";
      return '<div style="background:#0d1117;border:1px solid #1c2333;border-radius:4px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start">'+
        '<div><span style="font-size:15px;font-weight:800;font-family:monospace;color:#e6edf3;margin-right:10px">$'+s.t+'</span><div style="font-size:11px;color:#8b949e;margin-top:4px">'+s.note+'</div></div>'+
        '<div style="text-align:right"><div style="font-size:14px;font-weight:700;font-family:monospace;color:'+c+'">'+s.gap+'</div><div style="font-size:9px;color:'+c+'">'+s.dir.toUpperCase()+'</div></div>'+
      '</div>';
    }).join("")+
    '<div style="margin-top:10px;font-size:10px;color:#30363d">Options do NOT trade pre-market. Confirm prices in Webull before trading.</div>';
}

function renderDarkpool(){
  return '<div style="font-size:9px;color:#b57bee;letter-spacing:3px;margin-bottom:14px">🌑 DARK POOL LEVELS</div>'+
    '<div style="font-size:11px;color:#8b949e;margin-bottom:16px;line-height:1.6">Institutional block trades off public exchanges. These levels act as key support/resistance.</div>'+
    TICKERS.map(function(ticker){
      var a=AN[ticker];var q=state.quotes[ticker];
      var priceStr=q?"$"+q.price+" "+'<span style="color:'+(q.isPos?"#00e676":"#ff1744")+'">'+q.pct+'%</span>':"";
      return '<div style="background:#0d1117;border:1px solid #b57bee22;border-radius:5px;padding:12px 16px;margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
          '<span style="font-size:13px;font-weight:700;font-family:monospace;color:#e6edf3">$'+ticker+'</span>'+
          '<span style="font-size:12px;font-family:monospace">'+priceStr+'</span>'+
        '</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          a.dp.map(function(d){
            var c=d.type==="Support"?"#00e676":"#ff1744";
            return '<div style="background:'+c+'0a;border:1px solid '+c+'33;border-radius:3px;padding:8px 14px;flex:1;min-width:120px">'+
              '<div style="font-size:8px;color:'+c+';letter-spacing:2px;margin-bottom:3px">'+d.type.toUpperCase()+'</div>'+
              '<div style="font-size:15px;font-family:monospace;font-weight:700;color:'+c+'">'+d.level+'</div>'+
              '<div style="font-size:9px;color:#30363d">'+d.size+' shares printed</div>'+
            '</div>';
          }).join("")+
        '</div>'+
      '</div>';
    }).join("")+
    '<div style="margin-top:10px;font-size:10px;color:#30363d">Dark pool data sourced from public databases. Updated daily.</div>';
}

function renderCongress(){
  return '<div style="font-size:9px;color:#ffab00;letter-spacing:3px;margin-bottom:14px">🏛️ CONGRESS TRADES · PUBLIC DISCLOSURE</div>'+
    '<div style="font-size:11px;color:#8b949e;margin-bottom:16px;line-height:1.6">US Congress members must disclose trades within 45 days. Many have historically beaten the market.</div>'+
    CONGRESS.map(function(c){
      var color=c.action==="BUY"?"#00e676":"#ff1744";
      var pcolor=c.party==="R"?"#ff6b6b":"#6b9fff";
      return '<div class="congress-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
          '<div>'+
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'+
              '<span style="font-size:15px;font-weight:700;font-family:monospace;color:#e6edf3">$'+c.ticker+'</span>'+
              tag(c.action,color)+
              tag(c.party==="R"?"REP":"DEM",pcolor)+
            '</div>'+

          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:12px;color:'+color+';font-family:monospace;font-weight:700">'+c.amount+'</div>'+
            '<div style="font-size:9px;color:#30363d;margin-top:3px">'+c.date+', 2026</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join("")+
    '<div style="margin-top:10px;font-size:10px;color:#30363d">Up to 45-day reporting delay. Not financial advice.</div>';
}

function renderMovers(){
  var keys=Object.keys(state.quotes);
  if(keys.length===0) return '<div style="color:#30363d;font-size:12px">Hit Refresh to load live prices.</div>';
  var sorted=TICKERS.filter(function(t){return state.quotes[t];}).sort(function(a,b){
    return Math.abs(parseFloat(state.quotes[b].pct||0))-Math.abs(parseFloat(state.quotes[a].pct||0));
  });
  return '<div style="font-size:9px;color:#ffab00;letter-spacing:3px;margin-bottom:14px">MOVERS · SORTED BY % CHANGE · LIVE</div>'+
    sorted.map(function(t){
      var q=state.quotes[t];var a=AN[t];
      var c=q.isPos?"#00e676":"#ff1744";
      return '<div class="movers-card">'+
        '<div>'+
          '<span style="font-size:15px;font-weight:800;font-family:monospace;color:#e6edf3;margin-right:10px">$'+t+'</span>'+
          '<span style="font-size:11px;color:#8b949e">'+a.name+'</span>'+
          '<div style="font-size:10px;color:#30363d;margin-top:2px">H:$'+q.high+' L:$'+q.low+' Vol:'+q.volume+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:16px;font-weight:800;font-family:monospace;color:#e6edf3">$'+q.price+'</div>'+
          '<div style="font-size:13px;font-family:monospace;font-weight:600;color:'+c+'">'+q.pct+'%</div>'+
        '</div>'+
      '</div>';
    }).join("");
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render(){
  var s=state.session;
  var sColor=sessionColor(s);
  var tabs=["scanner","premarket","darkpool","congress","movers"];
  var tabLabels=["📊 SCANNER","🌅 PRE-MARKET","🌑 DARK POOL","🏛️ CONGRESS","🔥 MOVERS"];

  var tabsHTML=tabs.map(function(t,i){
    return '<button class="tab'+(state.tab===t?" active":"")+'" onclick="setTab(\''+t+'\')">'+tabLabels[i]+'</button>';
  }).join("");

  var themeHTML=SCAN.themes.map(function(t){
    var c=t.includes("IRAN")||t.includes("OIL")||t.includes("NVDA")||t.includes("META")?"#ff1744":"#4d9cf8";
    return tag(t,c);
  }).join(" ");

  var refreshBtn='<button class="refresh-btn" id="refresh-btn" onclick="doRefresh()">'+(state.loading?'<span class="spinner"></span>LOADING':'⟳ REFRESH')+'</button>';
  if(state.loading){
    document.getElementById("refresh-btn")&&(document.getElementById("refresh-btn").disabled=true);
  }

  var tabContent="";
  if(state.tab==="scanner") tabContent=renderScanner();
  else if(state.tab==="premarket") tabContent=renderPremarket();
  else if(state.tab==="darkpool") tabContent=renderDarkpool();
  else if(state.tab==="congress") tabContent=renderCongress();
  else if(state.tab==="movers") tabContent=renderMovers();

  var html=
    '<div class="header">'+
      '<div class="header-left">'+
        '<div class="header-sub">MARKET SCANNER v3.0</div>'+
        '<div class="header-title">TonyTrades <span style="font-size:11px;font-family:monospace;color:'+sColor+';animation:'+(s==="MARKET OPEN"?"pulse 1.5s infinite":"none")+'">● '+s+'</span></div>'+
        '<div class="header-status">'+state.priceStatus+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;align-items:center">'+
        (state.lastUpdate?'<div style="text-align:right"><div style="font-size:9px;color:#30363d">UPDATED</div><div style="font-size:10px;color:#8b949e;font-family:monospace">'+state.lastUpdate+'</div></div>':'')+
        refreshBtn+
      '</div>'+
    '</div>'+
    '<div class="tabs">'+tabsHTML+'</div>'+
    '<div class="banner">'+
      '<div class="banner-label">TODAY\'S THEMES · '+SCAN.date+'</div>'+
      '<div class="banner-text">'+SCAN.reasoning+'</div>'+
      '<div class="themes">'+themeHTML+'</div>'+
    '</div>'+
    '<div class="content">'+
      tabContent+
      '<div class="footer">'+
        '<div style="margin-bottom:3px">📡 Live prices: Twelve Data API · Research: Yahoo Finance, Robinhood, CNBC, TradingView, WSB</div>'+
        '<div style="margin-bottom:3px">🔄 Auto-refreshes every 30s during market hours · Pre-market 4am-9:30am ET · After-hours 4pm-8pm ET</div>'+
        '<div>⚠️ Not financial advice. Options involve substantial risk. Confirm prices in Webull before trading.</div>'+
      '</div>'+
    '</div>';

  document.getElementById("app").innerHTML=html;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function toggleCard(ticker){
  state.openCards[ticker]=!state.openCards[ticker];
  render();
}
function setView(v){ state.view=v; render(); }
function setTab(t){ state.tab=t; render(); }

async function doRefresh(){
  if(state.loading) return;
  state.loading=true;
  state.session=getSession();
  render();
  var q=await fetchPrices();
  if(Object.keys(q).length>0){
    state.quotes=q;
    state.priceStatus="Live via Twelve Data · "+new Date().toLocaleTimeString();
  } else {
    state.priceStatus="Price fetch failed — will retry";
  }
  state.lastUpdate=new Date().toLocaleTimeString();
  state.loading=false;
  render();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
doRefresh();
setInterval(function(){
  state.session=getSession();
  var s=state.session;
  if(s!=="WEEKEND"&&s!=="CLOSED") doRefresh();
},30000);
</script>
